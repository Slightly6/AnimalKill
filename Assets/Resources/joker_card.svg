   <!-- 牙齿：参差不齐 -->
   <rect x="200" y="480" width="16" height="14" fill="#c4b89a" opacity="0.7"/>
   <rect x="220" y="476" width="12" height="18" fill="#c4b89a" opacity="0.6"/>
   <rect x="236" y="476" width="16" height="14" fill="#c4b89a" opacity="0.7"/>
   <rect x="256" y="472" width="12" height="18" fill="#9a2020"/>
   <rect x="272" y="476" width="16" height="14" fill="#c4b89a" opacity="0.6"/>
   <rect x="292" y="476" width="12" height="18" fill="#c4b89a" opacity="0.7"/>
   <rect x="308" y="480" width="16" height="14" fill="#9a2020"/>
   <!-- 嘴角裂纹 -->
   <path d="M190 480L178 472L168 468" fill="none"
         stroke="#3a2010" stroke-width="3"/>
   <path d="M322 480L334 472L344 468" fill="none"
         stroke="#3a2010" stroke-width="3"/>

   <!-- 底部暗影 -->
   <rect x="128" y="590" width="264" height="38" fill="#06040c"/>
   <!-- 底部标记 -->
