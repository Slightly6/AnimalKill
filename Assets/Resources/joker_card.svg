<svg xmlns="http://www.w3.org/2000/svg" width="512" height="720"
      viewBox="0 0 512 720" shape-rendering="crispEdges">
   <title>Joker — Dark Grassland Boss (Head Only)</title>

   <!-- 卡牌外框：腐朽深色 -->
   <rect x="94" y="34" width="336" height="662" fill="#08060f"/>
   <rect x="100" y="40" width="324" height="650" fill="#1a1228"/>
   <rect x="108" y="48" width="308" height="634" fill="#0d0a17"/>
   <rect x="116" y="56" width="292" height="618" fill="#15101f"/>

   <!-- 卡面背景 -->
   <rect x="128" y="100" width="264" height="528" fill="#0a0712"/>
   <path d="M128 100H392V628H128Z" fill="#1e1430"/>

   <!-- 雾气渐变 -->
   <rect x="128" y="100" width="264" height="80" fill="#241a38" opacity="0.6"/>
   <rect x="128" y="568" width="264" height="60" fill="#06040c" opacity="0.7"/>

   <!-- 腐蚀边框 -->
   <rect x="116" y="56" width="292" height="6" fill="#3a2a1a"/>
   <rect x="116" y="668" width="292" height="6" fill="#3a2a1a"/>
   <rect x="116" y="56" width="6" height="618" fill="#3a2a1a"/>
   <rect x="402" y="56" width="6" height="618" fill="#3a2a1a"/>

   <!-- 裂痕装饰 -->
   <path d="M130 120L155 145L140 170L162 195L148 220" fill="none"
