   <rect x="180" y="395" width="60" height="26" fill="#0a0000"/>
   <rect x="272" y="395" width="60" height="26" fill="#0a0000"/>
   <!-- 眼瞳：血红发光 -->
   <rect x="196" y="400" width="22" height="16" fill="#c01818"/>
   <rect x="202" y="403" width="10" height="10" fill="#ff4040"/>
   <rect x="294" y="400" width="22" height="16" fill="#c01818"/>
   <rect x="300" y="403" width="10" height="10" fill="#ff4040"/>
   <!-- 眼下血泪 -->
   <rect x="202" y="421" width="6" height="24" fill="#8b1010"/>
   <rect x="300" y="421" width="6" height="24" fill="#8b1010"/>

   <!-- 鼻子：骷髅式三角空洞（放大） -->
   <path d="M240 440L272 440L266 468L246 468Z" fill="#0a0000"/>
   <path d="M246 446L266 446L263 462L249 462Z" fill="#1a0808"/>

   <!-- 嘴：裂开的大笑（放大） -->
   <path d="M190 480L256 470L322 480L314 514L298 532L256 538L214 532L198 514Z"
