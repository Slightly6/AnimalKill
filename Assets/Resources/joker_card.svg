         letter-spacing="3">BOSS</text>

   <!-- 卡面暗角 -->
   <rect x="128" y="100" width="20" height="528" fill="#06040c" opacity="0.6"/>
   <rect x="372" y="100" width="20" height="528" fill="#06040c" opacity="0.6"/>
   <rect x="128" y="100" width="264" height="20" fill="#06040c" opacity="0.5"/>
   <rect x="128" y="608" width="264" height="20" fill="#06040c" opacity="0.5"/>
</svg>
